<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compra tu iPhone</title>

  <!-- Dependencias necesarias -->
  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://sandbox-paybox.pagoplux.com/paybox/index.js"></script>

  <!-- Controllers -->
  <script src="controllers/compraController.js"></script>
  <script src="controllers/estadoPagoController.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 50px;
    }

    h1 {
      color: #333;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 400px;
      margin-top: 10px;
    }

    #transaccionInfo,
    #consultaResultado {
      margin-top: 20px;
    }

    #consultaResultado {
      padding: 15px;
      border: 1px solid #ccc;
      background-color: #f9f9f9;
      display: inline-block;
      width: 60%;
      text-align: left;
    }
  </style>
</head>

<body>

  <h1>Compra tu iPhone</h1>
  <p>iPhone 15 Pro Max - $1500.00</p>

  <!-- Botón de PagoPlux -->
  <button id="udElementoTest">Pagar con PagoPlux</button>

  <!-- Mostrar ID transacción después del pago exitoso -->
  <div id="transaccionInfo">
    <label for="inputIdTransaccion"><strong>ID de la Transacción:</strong></label><br>
    <input type="text" id="inputIdTransaccion" placeholder="Aquí se mostrará el ID..." readonly>
  </div>

  <!-- Input para consultar estado -->
  <div>
    <p><strong>Pega aquí el ID para consultar el estado de la transacción:</strong></p>
    <input type="text" id="inputIdConsulta" placeholder="Pega el ID de transacción aquí...">
    <br>
    <button onclick="consultarTransaccion()">Consultar Transacción</button>
  </div>

  <!-- Resultado de la consulta -->
  <div id="consultaResultado"></div>

  <!-- Variables y funciones de configuración -->
  <script>
    var data = {
      PayboxRemail: "dmorales@pagoplux.com",
      PayboxSendmail: "correocliente@gmail.com",
      PayboxRename: "Negocio de Iphone",
      PayboxSendname: "Nombre Tarjetahabiente",
      PayboxBase0: "5.00",
      PayboxBase12: "1500.00",
      PayboxDescription: "Compra de iPhone 15 Pro Max",
      PayboxLanguage: "es",
      PayboxDirection: "Ambato",
      PayBoxClientPhone: "0989353272",
      PayBoxClientIdentification: '1850201169',
      PayboxProduction: false,
      PayboxEnvironment: "sandbox",
      PayboxPagoPlux: true,
      PayboxIdElement: 'udElementoTest'
    };

    var ultimoIdTransaccion = null;

    // CALLBACK después del pago
    var onAuthorize = function (response) {
      if (response.status === 'succeeded') {
        console.log(' Proceso completado con éxito:', response);
        const idTransaccion = response.detail.id_transaccion;
        ultimoIdTransaccion = idTransaccion;

        // Mostrar el ID en el input de solo lectura
        document.getElementById('inputIdTransaccion').value = idTransaccion;

        // Registrar el pago en backend
        compraController.registrarPago(idTransaccion);

      } else {
        console.log(' Proceso incompleto:', response);
        alert('Proceso completado sin éxito');
      }
    };

    // FUNCION para consultar el estado, llamada al hacer clic en el botón
    function consultarTransaccion() {
      const inputConsulta = document.getElementById('inputIdConsulta').value.trim();

      if (!inputConsulta) {
        alert(' Debes ingresar el ID de la transacción para consultar.');
        return;
      }

      estadoPagoController.consultar(inputConsulta);
    }
  </script>

</body>

</html>
